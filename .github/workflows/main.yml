name: Check GlassifAI Build Environment

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: xcode-27

    steps:
      - name: Check out GlassifAI
        uses: actions/checkout@v4

      - name: Show Mac and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Check Rust
        run: |
          rustc --version
          cargo --version
