name: Build GlassifAI iPhone App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Check out GlassifAI
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Build GlassifAI native framework
        run: |
          chmod +x ./scripts/build-native.sh
          ./scripts/build-native.sh

      - name: Build unsigned GlassifAI iPhone app
        run: |
          xcodebuild \
            -project ios/GlassifAI.xcodeproj \
            -scheme GlassifAI \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify GlassifAI iPhone app
        run: |
          test -d build/Build/Products/Debug-iphoneos/GlassifAI.app
          ls -la build/Build/Products/Debug-iphoneos/GlassifAI.app

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/GlassifAI.app Payload/
          zip -r GlassifAI-unsigned.ipa Payload

      - name: Upload unsigned GlassifAI IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassifAI-unsigned-iPhone-IPA
          path: GlassifAI-unsigned.ipa
