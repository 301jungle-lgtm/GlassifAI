name: Build GlassifAI iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Check out GlassifAI
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Build GlassifAI native framework
        run: |
          chmod +x ./scripts/build-native.sh
          ./scripts/build-native.sh

      - name: Build GlassifAI iOS app
        run: |
          xcodebuild \
            -project ios/GlassifAI.xcodeproj \
            -scheme GlassifAI \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify GlassifAI app
        run: |
          test -d build/Build/Products/Debug-iphonesimulator/GlassifAI.app
          ls -la build/Build/Products/Debug-iphonesimulator/GlassifAI.app

      - name: Upload GlassifAI app
        uses: actions/upload-artifact@v4
        with:
          name: GlassifAI-iOS-Simulator-App
          path: build/Build/Products/Debug-iphonesimulator/GlassifAI.app
